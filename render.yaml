services:
  - type: web
    name: markethub
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: APP_KEY
        generateValue: true
      - key: APP_NAME
        value: MarketHub
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_TIMEZONE
        value: Asia/Karachi
      - key: LOG_CHANNEL
        value: stderr
      # Database configuration is managed exclusively in the Render
      # Environment UI. Blueprint sync must never reset DB_CONNECTION
      # or demo-seeding flags when a MySQL database is attached.
      # For fresh reviewer demos, configure DB_CONNECTION=sqlite and
      # MARKETHUB_SEED_DEMO=true in Render. For production MySQL,
      # configure DB_CONNECTION=mysql and MARKETHUB_SEED_DEMO=false.
      - key: QUEUE_CONNECTION
        value: database
      - key: MAIL_MAILER
        value: log
