services:
  - type: web
    name: markethub
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: APP_KEY
        generateValue: true
      - key: APP_NAME
        value: MarketHub
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_TIMEZONE
        value: Asia/Karachi
      - key: LOG_CHANNEL
        value: stderr
      # Default is a disposable reviewer demo. For persistent use, change
      # DB_CONNECTION and set DB_HOST/PORT/DATABASE/USERNAME/PASSWORD securely.
      - key: DB_CONNECTION
        value: sqlite
      - key: MARKETHUB_SEED_DEMO
        value: "true"
      - key: QUEUE_CONNECTION
        value: database
      - key: MAIL_MAILER
        value: log
